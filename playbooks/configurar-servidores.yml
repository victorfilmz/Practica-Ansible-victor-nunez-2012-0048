---
- name: Configurar los cinco servidores Ubuntu
  hosts: servidores
  become: true

  tasks:
    - name: Actualizar la lista de paquetes de APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Actualizar los paquetes instalados
      ansible.builtin.apt:
        upgrade: dist

    - name: Crear el usuario itla
      ansible.builtin.user:
        name: itla
        state: present
        create_home: true
        shell: /bin/bash

    - name: Crear la carpeta app
      ansible.builtin.file:
        path: /app
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Crear el archivo hola.txt
      ansible.builtin.copy:
        dest: /app/hola.txt
        content: "Hola desde Ansible en Ubuntu.\n"
        owner: root
        group: root
        mode: "0644"

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present
        update_cache: true
